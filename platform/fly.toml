# Fly.io configuration for the public Patchbay demo room.
#
# Rename `app` if you create the application under a different name, and set
# PHX_HOST to the matching hostname. Deployment steps are in docs/DEPLOY.md.

app = "patchbay-regents"
primary_region = "ewr"

# Give open LiveView sessions time to finish instead of cutting them off the
# moment a replacement machine is ready.
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "platform/Dockerfile"

[deploy]
  release_command = "/app/bin/migrate"
  # A new machine starts and must answer the health check below before it
  # takes traffic; until then the running release keeps serving.
  strategy = "bluegreen"

[env]
  # The shared Regent database cluster (Patchbay.DatabaseConfig). None of these
  # is secret; the two database URLs are.
  PATCHBAY_DEPLOYMENT_ROLE = "production"
  PATCHBAY_DATABASE_TARGET_MODE = "production"
  PATCHBAY_DATABASE_CLUSTER_ID = "dzx6qo6xqzvojpv5"
  PATCHBAY_DATABASE_CLUSTER_NAME = "regents-platform-prod"

  # The motion lab at /animations (PatchbayWeb.Showcase): "off" until Sean
  # opens it, then "public".
  PATCHBAY_SHOWCASE = "off"

  # Privy-backed OAuth grants only read access to ChatGPT event subscriptions.
  PATCHBAY_OAUTH_ENABLED = "true"

# Read by Fly's own scraper over the private network; never routed publicly.
[metrics]
  port = 9091
  path = "/metrics"

[http_service]
  internal_port = 4000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  # The demo URL is public, so the single machine stays running instead of
  # cold-starting on a visitor's first request.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
    timeout = "5s"
    # Names the site's own host so the check never depends on Fly's default.
    [http_service.checks.headers]
      Host = "patchbay.help"

# Two dedicated processors and 4 GB. Every visitor reaches the machine; when
# Sentinel's readings show it filling up, the answer is a bigger machine,
# chosen by hand (Sean, 14 October 2026). Measured on 14 October 2026 on the
# live code: each open page, its connection included, adds about 0.4 MB to the
# machine, and the Wallet Bench page is the heaviest load.
[[vm]]
  size = "performance-2x"
  memory = "4gb"
  cpu_kind = "performance"
  cpus = 2
