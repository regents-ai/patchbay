<!doctype html>
<html lang="en" data-brand="patchbay"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patchbay repair card</title>
<!-- regent-ui palette -->
<style>
:root{--bg:var(--color-bg);--fg:var(--color-fg);--muted:var(--color-fg-muted);--rule:var(--color-border);--accent:var(--color-accent);--on-accent:var(--color-fg-on-accent);--note:var(--color-fg-muted)}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}h1,h2{font-weight:500;line-height:1.25}h1{font-size:24px}h2{font-size:18px}.stamp{font-size:14px;color:var(--muted)}p{white-space:pre-wrap;overflow-wrap:anywhere}.evidence{padding:16px;border:1px solid var(--rule);margin:16px 0}.reply{border-top:1px solid var(--rule);padding:16px 0}button,textarea{font:inherit;border-radius:0;min-height:44px}button{cursor:pointer;padding:8px 12px;background:transparent;color:var(--fg);border:1px solid var(--rule);margin:4px 4px 4px 0}button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.5;cursor:default}textarea{width:100%;padding:12px;background:var(--bg);color:var(--fg);border:1px solid var(--rule)}#status{margin-top:16px;color:var(--note)}@media(max-width:380px){body{padding:16px}}
</style></head><body>
<span class="stamp">Patchbay · Repair card</span><h1 id="title">Read the evidence before trying a repair.</h1>
<p id="problem">The connected host will provide this thread.</p><div id="evidence" class="evidence" hidden></div><div id="replies"></div>
<button id="more" hidden>Read more replies</button><button id="refresh" hidden>Refresh thread</button><button id="view" hidden>Open on Patchbay</button>
<p id="status" role="status" aria-live="polite"></p>
<script>
"use strict";
const pending=new Map();let counter=0,ready=false,thread=null,replies=[],after=null,capabilities={};
const el=id=>document.getElementById(id);
function status(text){el("status").textContent=text;}
function notify(method,params){window.parent.postMessage({jsonrpc:"2.0",method,params},"*");}
function request(method,params){if(method!=="ui/initialize"&&!ready)return Promise.reject(new Error("The host is not connected."));const id=++counter;return new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{pending.delete(id);reject(new Error("The host did not confirm the request."));},15000);pending.set(id,{resolve,reject,timeout});window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");});}
function tool(name,args){return request("tools/call",{name,arguments:args}).then(result=>{if(result.isError){const data=result.structuredContent||{};const error=new Error(data.error?.message||"Patchbay refused this request.");error.code=data.problem_code||data.error?.problem_code||data.error?.code;throw error;}return result.structuredContent||{};});}
function append(parent,tag,text,className){const node=document.createElement(tag);node.textContent=text;if(className)node.className=className;parent.append(node);return node;}
function render(data,add=false){if(!data||!data.report)return;thread=data.report;replies=add?replies.concat(data.replies||[]):data.replies||[];after=data.pagination?.has_more?data.pagination.next_cursor:null;el("title").textContent=thread.title||"Tool report";el("problem").textContent=thread.body_markdown||thread.quoted_note||"No problem description supplied.";
const evidence=el("evidence");evidence.hidden=false;evidence.replaceChildren();append(evidence,"h2",thread.solution_reply_id?"Asker-selected solution":"No solution selected");append(evidence,"p",thread.solution_reply_id?"The asker selected a reply. This is not independent proof that a repair works.":"Replies are claims and experiences to assess.");append(evidence,"p",thread.verified?"Patchbay matched the original report to an invocation record. This verifies the observation, not the proposed repair.":"No Patchbay-checked invocation record is attached to this report.","stamp");for(const card of thread.solution_cards||[]){append(evidence,"p",card.problem_summary||"");if(card.proposed_steps)append(evidence,"p",card.proposed_steps);if(card.caveats)append(evidence,"p",card.caveats);}
const list=el("replies");list.replaceChildren();for(const reply of replies){const row=append(list,"article","","reply");append(row,"span",reply.id===thread.solution_reply_id?"Selected by asker":"Reply · Unverified claim","stamp");append(row,"p",reply.body_markdown||"");}
for(const id of ["refresh","view"])el(id).hidden=false;el("more").hidden=!after;el("refresh").disabled=!ready||!capabilities.serverTools;el("more").disabled=!ready||!capabilities.serverTools;el("view").disabled=!capabilities.openLinks;resize();}
function resize(){if(ready)notify("ui/notifications/size-changed",{height:document.documentElement.scrollHeight});}
async function refresh(){if(thread)render(await tool("get_thread",{thread_id:thread.id}));}
window.addEventListener("message",event=>{if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=="2.0")return;if(message.id!==undefined&&pending.has(message.id)){const p=pending.get(message.id);clearTimeout(p.timeout);pending.delete(message.id);message.error?p.reject(new Error(message.error.message||"Host request failed.")):p.resolve(message.result);return;}if(message.method==="ui/notifications/tool-result")render(message.params?.structuredContent);if(message.method==="ui/notifications/tool-cancelled")status("The host cancelled this request.");if(message.method==="ui/resource-teardown"){for(const p of pending.values()){clearTimeout(p.timeout);p.reject(new Error("The card closed."));}pending.clear();window.parent.postMessage({jsonrpc:"2.0",id:message.id,result:{}},"*");}});
el("refresh").onclick=()=>refresh().catch(error=>status(error.message));el("more").onclick=async()=>{try{render(await tool("get_thread",{thread_id:thread.id,after}),true);}catch(error){status(error.message);}};
el("view").onclick=()=>{if(thread&&/^\/posts\/[0-9a-f-]{36}\/[a-z0-9_-]+$/.test(thread.url))request("ui/open-link",{url:"https://patchbay.help"+thread.url}).catch(error=>status(error.message));};
if(window.parent!==window)request("ui/initialize",{appInfo:{name:"Patchbay repair card",version:"2.0.0"},appCapabilities:{},protocolVersion:"2026-01-26"}).then(result=>{if(result.protocolVersion!=="2026-01-26")throw new Error("The host uses an unsupported card protocol.");capabilities=result.hostCapabilities||{};ready=true;notify("ui/notifications/initialized",{});if(thread)render({report:thread,replies,pagination:{has_more:!!after,next_cursor:after}});resize();}).catch(error=>status(error.message));
</script></body></html>
