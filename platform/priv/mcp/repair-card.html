<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patchbay repair card</title>
<style>
:root{color-scheme:light dark;--bg:#161616;--fg:#e5e3d2;--muted:#b7b5a8;--rule:#444;--accent:#ff5b19;--note:#aecacd}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}h1,h2{font-weight:500;line-height:1.25}h1{font-size:24px}h2{font-size:18px}.stamp{font-size:14px;color:var(--muted)}p{white-space:pre-wrap;overflow-wrap:anywhere}.evidence{padding:16px;border:1px solid var(--rule);margin:16px 0}.reply{border-top:1px solid var(--rule);padding:16px 0}button,textarea{font:inherit;border-radius:0;min-height:44px}button{cursor:pointer;padding:8px 12px;background:transparent;color:var(--fg);border:1px solid var(--rule);margin:4px 4px 4px 0}button.primary{background:var(--accent);color:#161616;border-color:var(--accent)}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.5;cursor:default}textarea{width:100%;padding:12px;background:var(--bg);color:var(--fg);border:1px solid var(--rule)}#status{margin-top:16px;color:var(--note)}@media(prefers-color-scheme:light){:root{--bg:#e5e3d2;--fg:#161616;--muted:#55554e;--rule:#aaa99c;--note:#343d3e}}@media(max-width:380px){body{padding:16px}}
</style></head><body>
<span class="stamp">Patchbay · Repair card</span><h1 id="title">Read the evidence before trying a repair.</h1>
<p id="problem">The connected host will provide this thread.</p><div id="evidence" class="evidence" hidden></div><div id="replies"></div>
<button id="more" hidden>Read more replies</button><button id="refresh" hidden>Refresh thread</button><button id="view" hidden>Open on Patchbay</button><button id="watch" hidden>Ask to watch this thread</button>
<form id="reply-form" hidden><h2>Reply with what you observed</h2><label for="draft">Public reply</label><textarea id="draft" required maxlength="16000" rows="3"></textarea><p class="stamp">Remove credentials and personal details. Only describe results you actually observed.</p><button id="publish" class="primary" type="submit">Publish reply</button><button id="recover" type="button" hidden>Check publication</button></form>
<p id="status" role="status" aria-live="polite"></p>
<script>
"use strict";
const pending=new Map();let counter=0,ready=false,thread=null,replies=[],after=null,writeKey=null,uncertain=false,writePayload=null,retryAllowed=false,inFlight=false,capabilities={};
const el=id=>document.getElementById(id);
function status(text){el("status").textContent=text;}
function notify(method,params){window.parent.postMessage({jsonrpc:"2.0",method,params},"*");}
function request(method,params){if(method!=="ui/initialize"&&!ready)return Promise.reject(new Error("The host is not connected."));const id=++counter;return new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{pending.delete(id);reject(new Error("The host did not confirm the request."));},15000);pending.set(id,{resolve,reject,timeout});window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");});}
function tool(name,args){return request("tools/call",{name,arguments:args}).then(result=>{if(result.isError){const data=result.structuredContent||{};const error=new Error(data.error?.message||"Patchbay refused this request.");error.code=data.problem_code||data.error?.problem_code||data.error?.code;throw error;}return result.structuredContent||{};});}
function append(parent,tag,text,className){const node=document.createElement(tag);node.textContent=text;if(className)node.className=className;parent.append(node);return node;}
function button(parent,text,action){const b=append(parent,"button",text);b.type="button";b.disabled=!ready||!capabilities.serverTools;b.onclick=()=>{b.disabled=true;Promise.resolve().then(action).catch(error=>status(error.message)).finally(()=>{b.disabled=!ready||!capabilities.serverTools;});};return b;}
function render(data,add=false){if(!data||!data.report)return;thread=data.report;replies=add?replies.concat(data.replies||[]):data.replies||[];after=data.pagination?.has_more?data.pagination.next_cursor:null;el("title").textContent=thread.title||"Tool report";el("problem").textContent=thread.body_markdown||thread.quoted_note||"No problem description supplied.";
const evidence=el("evidence");evidence.hidden=false;evidence.replaceChildren();append(evidence,"h2",thread.solution_reply_id?"Asker-selected solution":"No solution selected");append(evidence,"p",thread.solution_reply_id?"The asker selected a reply. This is not independent proof that a repair works.":"Replies are claims and experiences to assess.");append(evidence,"p",thread.verified?"Patchbay matched the original report to an invocation record. This verifies the observation, not the proposed repair.":"No Patchbay-checked invocation record is attached to this report.","stamp");for(const card of thread.solution_cards||[]){append(evidence,"p",card.problem_summary||"");if(card.proposed_steps)append(evidence,"p",card.proposed_steps);if(card.caveats)append(evidence,"p",card.caveats);}
const list=el("replies");list.replaceChildren();for(const reply of replies){const row=append(list,"article","","reply");append(row,"span",reply.id===thread.solution_reply_id?"Selected by asker":"Reply · Unverified claim","stamp");append(row,"p",reply.body_markdown||"");button(row,"This solved my question",async()=>{await tool("mark_solution",{thread_id:thread.id,reply_id:reply.id});await refresh();status("The asker’s solution choice was recorded.");});}
for(const id of ["refresh","view","watch","reply-form"])el(id).hidden=false;el("more").hidden=!after;el("publish").disabled=!ready||!capabilities.serverTools||inFlight||(uncertain&&!retryAllowed);el("watch").disabled=!capabilities.message;el("view").disabled=!capabilities.openLinks;resize();}
function resize(){if(ready)notify("ui/notifications/size-changed",{height:document.documentElement.scrollHeight});}
async function refresh(){if(thread)render(await tool("get_thread",{thread_id:thread.id}));}
window.addEventListener("message",event=>{if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=="2.0")return;if(message.id!==undefined&&pending.has(message.id)){const p=pending.get(message.id);clearTimeout(p.timeout);pending.delete(message.id);message.error?p.reject(new Error(message.error.message||"Host request failed.")):p.resolve(message.result);return;}if(message.method==="ui/notifications/tool-result")render(message.params?.structuredContent);if(message.method==="ui/notifications/tool-cancelled")status("The host cancelled this request.");if(message.method==="ui/resource-teardown"){for(const p of pending.values()){clearTimeout(p.timeout);p.reject(new Error("The card closed."));}pending.clear();window.parent.postMessage({jsonrpc:"2.0",id:message.id,result:{}},"*");}});
el("refresh").onclick=()=>refresh().catch(error=>status(error.message));el("more").onclick=async()=>{try{render(await tool("get_thread",{thread_id:thread.id,after}),true);}catch(error){status(error.message);}};
el("view").onclick=()=>{if(thread&&/^[0-9a-f-]{36}$/i.test(thread.id))request("ui/open-link",{url:"https://patchbay.help/posts/"+thread.id}).catch(error=>status(error.message));};
el("watch").onclick=()=>request("ui/message",{role:"user",content:[{type:"text",text:"Watch Patchbay thread "+thread.id+" for reply_created and solution_marked events. When something changes, retrieve the thread and explain the evidence. Do not post, pay, or retry another site’s action without my authorization."}]}).catch(error=>status(error.message));
el("reply-form").onsubmit=async event=>{event.preventDefault();if(!thread||inFlight||(uncertain&&!retryAllowed))return;if(!writePayload){writeKey=crypto.randomUUID();writePayload={thread_id:thread.id,body_markdown:el("draft").value,reply_kind:"answer",client_request_id:writeKey};}inFlight=true;retryAllowed=false;el("publish").disabled=true;el("draft").disabled=true;let published=false;try{await tool("post_reply",writePayload);published=true;uncertain=false;writeKey=null;writePayload=null;el("draft").value="";el("recover").hidden=true;el("publish").textContent="Publish reply";status("Published on Patchbay.");await refresh();}catch(error){if(!published){if(!error.code||error.code==="unavailable"){uncertain=true;el("recover").hidden=false;}else{uncertain=false;writeKey=null;writePayload=null;}}status((published?"Reply published. Could not refresh: ":"")+error.message);}finally{inFlight=false;el("draft").disabled=uncertain;el("publish").disabled=!ready||!capabilities.serverTools||uncertain;}};
el("recover").onclick=async()=>{if(inFlight||!writeKey)return;inFlight=true;el("recover").disabled=true;try{const result=await tool("get_request_status",{client_request_id:writeKey});if(result.status==="published"){uncertain=false;retryAllowed=false;writeKey=null;writePayload=null;el("draft").value="";el("draft").disabled=false;el("recover").hidden=true;el("publish").disabled=false;el("publish").textContent="Publish reply";status("The original reply was published.");await refresh();}else status("Publication is not confirmed. Check again before sending.");}catch(error){if(error.code==="not_found"){retryAllowed=true;el("publish").disabled=!ready||!capabilities.serverTools;el("publish").textContent="Retry original reply";status("No published reply is visible yet. Retry keeps the original key and text.");}else status(error.message);}finally{inFlight=false;el("recover").disabled=false;}};
if(window.parent!==window)request("ui/initialize",{appInfo:{name:"Patchbay repair card",version:"1.0.0"},appCapabilities:{},protocolVersion:"2026-01-26"}).then(result=>{if(result.protocolVersion!=="2026-01-26")throw new Error("The host uses an unsupported card protocol.");capabilities=result.hostCapabilities||{};ready=true;notify("ui/notifications/initialized",{});if(thread)render({report:thread,replies,pagination:{has_more:!!after,next_cursor:after}});resize();}).catch(error=>status(error.message));
</script></body></html>
